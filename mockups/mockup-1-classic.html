<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פלאקאר · מוקאפ 1 · קלאסי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#f3f6fb; --bg-bottom:#a9c7ec;
    --card:#ffffff; --ink-1:#1b2a41; --ink-2:#44526a; --ink-3:#8590a3;
    --navy:#1e3a6e; --brand:#f39200; --grid:#e8edf4; --axis:#9aa6b8; --hover:#f4f7fb;
    --up:#16a35a; --down:#e04848; --shadow:0 2px 10px rgba(30,58,110,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Heebo,system-ui,sans-serif;color:var(--ink-1);
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 45%,var(--bg-bottom) 100%);min-height:100vh}
  .wrap{max-width:1280px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);border-radius:14px;padding:12px 18px;box-shadow:var(--shadow);margin-bottom:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:14px}
  .brand img{height:46px}
  .brand h1{margin:0;font-size:20px;font-weight:800}
  .brand p{margin:0;font-size:12px;color:var(--ink-3)}
  .filters{display:flex;gap:12px;align-items:center}
  label.f{display:flex;flex-direction:column;font-size:11px;color:var(--ink-3);gap:2px}
  select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid #d5dce6;border-radius:8px;background:#fff;color:var(--ink-1);min-width:140px}
  .updated{font-size:12px;color:var(--ink-3);text-align:center;border:1px solid var(--grid);border-radius:10px;padding:6px 12px}
  .updated b{display:block;font-size:15px;color:var(--ink-1)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
  .kpi .t{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  .kpi .t::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--navy)}
  .kpi .v{font-size:30px;font-weight:800;margin:6px 0 4px;font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
  .chip{font-size:12px;font-weight:700;padding:1px 8px;border-radius:20px}
  .chip.up{background:#e3f6ea;color:#0f7a42}.chip.down{background:#fdeaea;color:#b42828}
  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:14px}
  h2{margin:0;font-size:18px;font-weight:800}
  .sub{font-size:12px;color:var(--ink-3);margin:2px 0 12px}
  .chart-box{position:relative;height:340px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-weight:600;color:var(--ink-3);text-align:right;padding:8px 6px;border-bottom:1px solid var(--grid);font-size:12px}
  td{padding:8px 6px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
  td.n{text-align:left}
  .bar-cell{display:flex;align-items:center;gap:8px}
  .mini{height:6px;border-radius:3px;background:var(--navy)}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-top:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:4px;vertical-align:-1px}
  footer{font-size:11px;color:#3e5375;text-align:center;padding:8px}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
  @media (max-width:520px){.kpis{grid-template-columns:1fr}.kpi .v{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="assets/logo.jpg" alt="לוגו פלאקאר">
      <div><h1>דאשבורד הזמנות</h1><p>הכנסות לפני מע״מ · כל הלקוחות</p></div>
    </div>
    <div class="filters">
      <label class="f">שנה<select id="year"></select></label>
      <div class="updated">עודכן עד<b id="upd"></b></div>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid2">
    <div class="card">
      <h2>הכנסות לפי שנה</h2>
      <div class="sub" id="lineSub"></div>
      <div class="chart-box"><canvas id="line"></canvas></div>
    </div>
    <div class="card">
      <h2>שינוי בהזמנות לפי לקוח</h2>
      <div class="sub" id="divSub"></div>
      <div id="div"></div>
      <div class="legend"><span><i style="background:var(--up)"></i>עלייה</span><span><i style="background:var(--down)"></i>ירידה</span></div>
    </div>
  </section>

  <section class="card">
    <h2>10 הלקוחות המובילים</h2>
    <div class="sub" id="topSub"></div>
    <div style="overflow-x:auto"><table id="top"></table></div>
  </section>
  <footer>מוקאפ 1 · קלאסי — נבנה מקבצי ההזמנות 2016–2026</footer>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const { D, fmt } = FC;
const sel = document.getElementById('year');
FC.yearOptions(sel);
document.getElementById('upd').textContent = D.lastDate.split('-').reverse().join('.');
Chart.defaults.font.family = 'Heebo';
Chart.defaults.color = '#44526a';

let line;
function drawLine(y) {
  const years = D.years;
  const rev = years.map(yr => FC.totals(yr, 12).rev);
  const partialIdx = years.findIndex(FC.isPartial);
  document.getElementById('lineSub').textContent =
    `סך ההכנסות בכל שנה · ${FC.LAST_YEAR} עד ${FC.MONTHS[FC.LAST_MONTH - 1]} (קו מקווקו)`;
  const data = {
    labels: years.map(String),
    datasets: [{
      data: rev, borderColor: '#1e3a6e', borderWidth: 2, tension: .25,
      backgroundColor: 'rgba(30,58,110,.08)', fill: true,
      pointRadius: years.map(yr => yr === y ? 7 : 4),
      pointBackgroundColor: years.map(yr => yr === y ? '#f39200' : '#1e3a6e'),
      pointBorderColor: '#fff', pointBorderWidth: 2, pointHoverRadius: 8,
      segment: { borderDash: ctx => ctx.p1DataIndex === partialIdx ? [6, 5] : undefined },
    }],
  };
  if (line) { line.data = data; line.update(); return; }
  line = new Chart(document.getElementById('line'), {
    type: 'line', data,
    options: {
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false },
        tooltip: { rtl: true, callbacks: { label: c => ` ${fmt.money(c.parsed.y)}${FC.isPartial(+c.label) ? ' (עד כה)' : ''}` } } },
      scales: {
        y: { beginAtZero: false, suggestedMin: 1.8e6, grid: { color: '#eef2f7' }, border: { display: false }, ticks: { callback: v => fmt.money(v) } },
        x: { grid: { display: false } },
      },
      onClick: (e, els) => { if (els.length) { sel.value = D.years[els[0].index]; render(); } },
    },
  });
}

function kpiCard(title, cur, prev, f) {
  const p = fmt.pct(cur, prev);
  const chip = p == null ? '' : `<span class="chip ${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(1)}%</span>`;
  return `<div class="card kpi"><div class="t">${title}</div><div class="v">${f(cur)}</div>
    <div class="s">${chip}${prev != null ? `<span>אשתקד: ${f(prev)}</span>` : '<span>אין שנה קודמת</span>'}</div></div>`;
}

function render() {
  const y = +sel.value;
  const { cur, prev } = FC.kpis(y);
  document.getElementById('kpis').innerHTML =
    kpiCard('הכנסות', cur.rev, prev?.rev, fmt.money) +
    kpiCard('מספר הזמנות', cur.orders, prev?.orders, fmt.num) +
    kpiCard('לקוחות פעילים', cur.custs, prev?.custs, fmt.num) +
    kpiCard('הזמנה ממוצעת', cur.avg, prev?.avg, v => `₪${fmt.num(v)}`);

  document.getElementById('divSub').textContent = D.monthly[y - 1]
    ? `${FC.periodLabel(y)} מול אותה תקופה ב-${y - 1} · 7 העליות ו-7 הירידות הגדולות`
    : '';
  FC.renderDiverging(document.getElementById('div'), FC.customerDelta(y, 0));

  const top = FC.topCustomers(y, 10);
  const max = top.rows[0]?.rev || 1;
  document.getElementById('topSub').textContent = `${FC.periodLabel(y)} · ${top.count} לקוחות פעילים`;
  document.getElementById('top').innerHTML = `<tr><th>#</th><th>לקוח</th><th>עיר</th><th>הזמנות</th><th>הכנסות</th><th>שינוי</th></tr>` +
    top.rows.map((r, i) => {
      const p = fmt.pct(r.rev, r.prevRev);
      return `<tr><td>${i + 1}</td><td>${r.name}</td><td style="color:var(--ink-3)">${r.city}</td><td>${fmt.num(r.orders)}</td>
      <td><div class="bar-cell"><div class="mini" style="width:${r.rev / max * 120}px"></div>${fmt.money(r.rev)}</div></td>
      <td>${p == null ? '<span style="color:var(--ink-3)">חדש</span>' : `<span dir="ltr" class="chip ${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '+' : '−'}${Math.abs(p).toFixed(0)}%</span>`}</td></tr>`;
    }).join('');
  drawLine(y);
}
sel.addEventListener('change', render);
render();
</script>
</body>
</html>
