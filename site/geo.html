<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניתוח הזמנות פלאקאר</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Layout: schematic map on one side, region detail on the other, city table below */
  :root{
    --bg:#eef1f5; --card:#ffffff; --ink-1:#18212f; --ink-2:#465166; --ink-3:#8a93a3;
    --accent:#f39200; --series:#2a5bd7; --grid:#e9edf2; --axis:#9aa3b2; --hover:#f5f7fa;
    --up:#16a35a; --down:#e04848; --sea:#dfe9f6; --land-0:#e3ebfb; --land-1:#1d47b3;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink-1);font-size:14px}
  header{background:var(--card);border-bottom:3px solid var(--accent);padding:8px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
  header img{height:38px}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .sp{flex:1}
  .tabs{display:flex;gap:2px;background:#eef1f5;border-radius:8px;padding:2px}
  .tabs a{font-size:13px;color:var(--ink-2);text-decoration:none;padding:5px 12px;border-radius:6px}
  .tabs a.on{background:#fff;color:var(--ink-1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg{display:inline-flex;background:#eef1f5;border-radius:8px;padding:2px}
  .seg button{font:inherit;font-size:12px;border:0;background:transparent;color:var(--ink-2);padding:5px 10px;border-radius:6px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink-1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid #d3d9e2;border-radius:7px;background:#fff}
  .meta{font-size:12px;color:var(--ink-3)}
  .wrap{padding:12px 16px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border-radius:10px;padding:12px 14px;min-width:0}
  .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  h2{margin:0;font-size:15px;font-weight:600}
  .sub{font-size:11px;color:var(--ink-3);margin:2px 0 8px}
  .main{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:10px}
  .mapbox{position:relative}
  svg.map{width:100%;height:auto;display:block;max-height:640px}
  .rg{cursor:pointer;stroke:#fff;stroke-width:2.5;stroke-linejoin:round;transition:filter .15s}
  .rg:hover{filter:brightness(1.06) saturate(1.1)}
  .rg.sel{stroke:var(--accent);stroke-width:4}
  .rg:focus-visible{outline:none;stroke:var(--accent);stroke-width:4}
  .lbl{pointer-events:none;font-family:Rubik,sans-serif;text-anchor:middle}
  .lbl .n{font-size:11px;font-weight:600}
  .lbl .v{font-size:10.5px}
  .scale{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-top:6px}
  .scale .bar{flex:1;height:8px;border-radius:4px}
  .regions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
  .rcard{border:1px solid var(--grid);border-radius:8px;padding:8px 10px;cursor:pointer;background:#fff;text-align:right;font:inherit;color:inherit}
  .rcard:hover{background:var(--hover)}
  .rcard.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .rcard .t{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  .rcard .t i{width:10px;height:10px;border-radius:3px}
  .rcard .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .rcard .d{font-size:11px;font-weight:600;color:var(--ink-3)}
  .up{color:#0f7a42!important}.down{color:#b42828!important}
  .detail h3{margin:0;font-size:18px}
  .kpis{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}
  .kpis div{font-size:11px;color:var(--ink-3)}
  .kpis b{display:block;font-size:17px;color:var(--ink-1);font-variant-numeric:tabular-nums}
  .list{list-style:none;margin:0;padding:0}
  .list li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--grid);font-size:12.5px}
  .list .n{color:var(--ink-3);font-size:11px}
  .list .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .nm small{color:var(--ink-3);margin-inline-start:6px}
  .list .b{height:4px;background:var(--series);border-radius:2px;margin-top:3px}
  .num{font-variant-numeric:tabular-nums;font-weight:500;text-align:left}
  .num small{display:block;color:var(--ink-3);font-weight:400;font-size:11px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-weight:500;color:var(--ink-3);text-align:right;padding:6px;border-bottom:1px solid var(--grid);font-size:11px;white-space:nowrap}
  td{padding:6px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
  td.l,th.l{text-align:left}
  .chip{font-size:11px;padding:1px 7px;border-radius:10px;background:#eef1f5;color:var(--ink-2)}
  .note{font-size:11px;color:var(--ink-3)}
  .trend{position:relative;height:250px}
  .lg{display:flex;flex-wrap:wrap;gap:2px 4px;margin-bottom:4px}
  .lg button{font:inherit;font-size:11px;color:var(--ink-2);background:none;border:0;border-radius:5px;padding:2px 5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .lg button:hover{background:var(--hover)}
  .lg button.off{opacity:.4}
  .lg i{width:12px;height:3px;border-radius:2px}
  /* Region cards in one row; map and trend share a row at equal height; lists below */
  .regions{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .main{grid-template-columns:minmax(240px,300px) 1fr;align-items:stretch}
  svg.map{max-height:440px;margin:0 auto}
  .detail{display:flex;flex-direction:column}
  .trend{flex:1 1 0;min-height:260px;height:auto}
  .bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:10px}
  /* City name on the right of its bar, aligned toward the bars */
  #cityCard .dv-row{height:22px;direction:rtl;grid-template-columns:minmax(90px,24%) 1fr}
  #cityCard .dv-label{font-size:12px;text-align:left;padding-inline-end:10px;border-inline-end:1px solid var(--grid);height:100%;display:flex;align-items:center;justify-content:flex-end}
  #cityCard .dv-track{direction:ltr;margin-inline:100px 100px}
  #cityCard .dv-val{direction:ltr}
  #cityCard .dv-bar{top:5px;bottom:5px}
  #cityCard .dv-val{font-size:11px;color:var(--ink-1)!important}
  .pick{position:relative;flex:0 1 260px;min-width:180px}
  .pick input{width:100%;font:inherit;font-size:13px;padding:6px 30px 6px 10px;border:1px solid #d3d9e2;border-radius:7px;background:#fff;text-overflow:ellipsis}
  .pick input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .pick input.set{border-color:var(--accent);background:#fff8ec;font-weight:500}
  .pick .clr{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-3);font-size:14px;cursor:pointer;padding:2px 4px;border-radius:4px}
  .pick .clr:hover{background:var(--hover);color:var(--ink-1)}
  .sugg{position:absolute;top:calc(100% + 4px);right:0;left:0;min-width:300px;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(20,30,50,.18);padding:4px;display:none;max-height:380px;overflow:auto;z-index:20}
  .sugg.on{display:block}
  .sugg button{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;font:inherit;font-size:13px;text-align:right;border:0;background:none;padding:7px 8px;border-radius:7px;cursor:pointer;color:var(--ink-1)}
  .sugg button:hover,.sugg button.act{background:var(--hover)}
  .sugg .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sugg small{color:var(--ink-3);font-size:11px;white-space:nowrap}
  .sugg .none{padding:10px;color:var(--ink-3);font-size:12px}
  @media (max-width:900px){.main,.cols{grid-template-columns:1fr}}
  @media (max-width:1100px){.regions{grid-template-columns:repeat(4,minmax(0,1fr))}.bottom{grid-template-columns:1fr}}
  @media (max-width:520px){.regions{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
  .gate[hidden],.gate.auto{display:none}
  .bootbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;overflow:hidden;background:transparent}
  .bootbar[hidden]{display:none}
  .bootbar::after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:var(--accent);animation:boot 1s ease-in-out infinite}
  @keyframes boot{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
  /* Netlify pins its badge to the bottom corner; room at the end lets the last rows scroll clear of it */
  body{padding-bottom:88px}
  .gate form{background:var(--card);border-radius:14px;padding:28px 26px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(20,30,50,.12);border-top:4px solid var(--accent)}
  .gate img{height:52px;align-self:center}
  .gate h2{margin:0;font-size:18px;text-align:center}
  .gate p{margin:0;font-size:13px;color:var(--ink-3);text-align:center}
  .gate input{font:inherit;font-size:15px;padding:10px 12px;border:1px solid #d3d9e2;border-radius:8px;direction:ltr;text-align:center}
  .gate input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .gate button{font:inherit;font-size:15px;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
  .gate button:disabled{opacity:.6;cursor:wait}
  .gate .err{color:var(--down);font-size:13px;min-height:18px;text-align:center}
</style>
</head>
<body>
<div class="bootbar" id="bootbar"></div>
<div class="gate auto" id="gate">
  <form id="gate-form" autocomplete="off">
    <img src="assets/logo.jpg" alt="לוגו פלאקאר">
    <h2>ניתוח הזמנות</h2>
    <p>הנתונים מוצפנים. הזינו סיסמה כדי לצפות.</p>
    <input id="gate-pw" type="password" placeholder="סיסמה" aria-label="סיסמה" autocomplete="current-password">
    <button type="submit">כניסה</button>
    <div class="err" id="gate-err" role="alert"></div>
  </form>
</div>
<script>(function () { var ok = false; try { var m = JSON.parse(localStorage.getItem('flacar-key') || 'null'); ok = !!(m && Date.now() - m.t < 12 * 3600 * 1000); } catch (e) {} if (!ok) document.getElementById('gate').classList.remove('auto'); })();</script>
<header>
  <img src="assets/logo.jpg" alt="לוגו פלאקאר">
  <h1>מפת מכירות</h1>
  <nav class="tabs" aria-label="דפים">
    <a href="index.html">סקירה</a>
    <a href="index.html#compare">השוואות</a>
    <a href="geo.html" class="on" aria-current="page">מפה</a>
    <a href="calendar.html">לוח שנה</a>
  </nav>
  <span class="sp"></span>
  <div class="pick" id="prodPick">
    <input id="prodQ" placeholder="כל המוצרים" autocomplete="off" aria-label="סינון לפי מוצר">
    <button type="button" class="clr" id="prodClr" hidden aria-label="ניקוי סינון המוצר" title="כל המוצרים">✕</button>
    <div class="sugg" id="prodSugg" role="listbox"></div>
  </div>
  <div class="seg" id="metric"><button data-v="rev" class="on">הכנסות</button><button data-v="orders">הזמנות</button><button data-v="custs">לקוחות</button></div>
  <div class="seg" id="mode"><button data-v="value" class="on">ערך</button><button data-v="change">שינוי מול אשתקד</button></div>
  <label class="meta">שנה <select id="year"></select></label>
</header>

<div class="wrap">
  <section class="regions" id="regions"></section>

  <section class="main">
    <div class="card">
      <h2 id="mapTitle"></h2>
      <div class="sub" id="mapSub"></div>
      <div class="mapbox"><svg class="map" id="map" viewBox="0 0 230 560" role="img" aria-label="מפה סכמטית של ישראל לפי אזורים"></svg></div>
      <div class="scale" id="scale"></div>
    </div>
    <div class="card detail" id="detail"></div>
  </section>

  <section class="bottom">
    <div class="card">
      <h2 id="topTitle"></h2>
      <div class="sub" id="topSub"></div>
      <ul class="list" id="topCities"></ul>
    </div>
    <div class="card" id="cityCard">
      <div class="ch"><h2 id="cityTitle"></h2><span class="note" id="cityNote"></span></div>
      <div class="sub" id="citySub"></div>
      <div id="cityDiv"></div>
    </div>
  </section>
</div>

<script src="data.enc.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
(function () {
  const E = window.FLACAR_ENC, KEY = 'flacar-key', TTL = 12 * 3600 * 1000;
  const gate = document.getElementById('gate'), boot = document.getElementById('bootbar');
  const form = document.getElementById('gate-form'), pw = document.getElementById('gate-pw'), err = document.getElementById('gate-err'), btn = form.querySelector('button');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  try { localStorage.removeItem('flacar-pw'); } catch (e) {}
  function load(src) { return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.body.appendChild(s); }); }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(E.iv) }, key, b64(E.ct));
    const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    window.FLACAR_DATA = JSON.parse(text);
    gate.hidden = true;
    await load('common.js');
    await load('geo-app.js');
    boot.hidden = true;
  }
  // The slow step (deriving the key from the password) runs once; the key is kept on this device
  // for 12 hours, so other pages open straight away without the password screen
  async function withPassword(p) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(E.salt), iterations: E.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    await open(key);
    try { localStorage.setItem(KEY, JSON.stringify({ k: toB64(await crypto.subtle.exportKey('raw', key)), s: E.salt, t: Date.now() })); } catch (e) {}
  }
  function showForm() { gate.classList.remove('auto'); boot.hidden = true; pw.focus(); }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!pw.value) return;
    btn.disabled = true; btn.textContent = 'פותח…'; err.textContent = '';
    try { await withPassword(pw.value); }
    catch (x) { err.textContent = 'הסיסמה שגויה. נסו שוב.'; pw.select(); }
    btn.disabled = false; btn.textContent = 'כניסה';
  });
  let saved = null;
  try {
    const m = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (m && m.s === E.salt && Date.now() - m.t < TTL) saved = m.k;
  } catch (e) {}
  if (!saved) return showForm();
  crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']).then(open)
    .catch(() => { try { localStorage.removeItem(KEY); } catch (e) {} showForm(); });
})();
</script>
</body>
</html>
